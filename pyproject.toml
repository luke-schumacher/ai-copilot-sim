[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simlab"
version = "0.1.0"
description = "Simulator rig tooling for the AI Copilot student project: recorder, mock stream, latency model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "simpy>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["simlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
